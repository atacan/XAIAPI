# OpenAPI Overlay for XAIAPI
# This file allows you to make manual corrections to the OpenAPI specification
# without modifying the original file. The bootstrapper will apply this overlay
# on top of the cleaned openapi.yaml file.
#
# For overlay syntax, see: https://github.com/OAI/Overlay-Specification
#
# Update actions recursively merge objects and concatenate arrays. To replace
# an entire schema, remove the schema in one action and add it to
# $.components.schemas in the next action.

overlay: 1.0.0
info:
  title: XAIAPI API Overlay
  version: 1.0.0

# Example actions (uncomment and modify as needed):
# actions:
#   # Make a field required
#   - target: "$.components.schemas.User"
#     update:
#       required:
#         - user_id
#         - email
#
#   # Add a missing property
#   - target: "$.components.schemas.Product"
#     update:
#       properties:
#         newField:
#           type: string
#           description: "A field that was missing in the original spec"
#
#   # Fix an incorrect type
#   - target: "$.components.schemas.Order.properties.total"
#     update:
#       type: number
#       format: double
#
#   # Remove a deprecated field
#   - target: "$.components.schemas.LegacyModel.properties.oldField"
#     remove: true

actions:
  # swift-openapi-generator requires multipart/form-data schemas to be plain
  # objects. The original oneOf/not discrimination hack ("exactly one of
  # file or url") makes the generator silently drop the request body.
  # Replace the schema without oneOf. `file` is listed last because xAI
  # requires the file part to be sent after all other multipart fields.
  - target: "$.components.schemas.SpeechToTextRequest"
    remove: true
  - target: "$.components.schemas"
    update:
      SpeechToTextRequest:
        type: object
        additionalProperties: false
        description: 'Multipart form fields for speech-to-text. Exactly one of `file`
          or `url` should be supplied.

          '
        properties:
          url:
            type: string
            format: uri
            description: URL of an audio file for xAI to download and transcribe server-side.
          audio_format:
            type: string
            enum:
            - pcm
            - mulaw
            - alaw
            description: 'Format hint for raw/headerless audio only.

              Do not set this for container formats such as MP3 or WAV.

              '
          sample_rate:
            type: integer
            enum:
            - 8000
            - 16000
            - 22050
            - 24000
            - 44100
            - 48000
            description: 'Sample rate in Hz. Required for raw/headerless audio using
              `audio_format`.

              '
          language:
            $ref: '#/components/schemas/SpeechToTextLanguage'
          format:
            type: boolean
            default: false
            description: 'Enables inverse text normalization, converting spoken numbers,
              currencies, and units into written form. Requires `language`.

              '
          multichannel:
            type: boolean
            default: false
            description: 'When true, transcribes each audio channel independently and
              returns per-channel transcripts in `channels`.

              '
          channels:
            type: integer
            minimum: 2
            maximum: 8
            description: 'Number of audio channels. Required for multichannel raw audio.
              Container formats can be auto-detected.

              '
          diarize:
            type: boolean
            default: false
            description: 'Enables speaker diarization. When enabled, words may include
              a `speaker` integer identifying the detected speaker.

              '
          keyterm:
            type: array
            maxItems: 100
            description: 'Terms that bias transcription toward specific names, product
              names, or proper nouns. xAI accepts this multipart field
              repeatedly. Maximum 100 terms.

              '
            items:
              type: string
              maxLength: 50
          filler_words:
            type: boolean
            default: false
            description: 'When true, filler words such as "uh", "um", and "er" are retained.
              By default they are removed from the transcript and word array.

              '
          vad_threshold:
            type: number
            minimum: 0
            maximum: 1
            default: 0.5
            description: 'Speech-probability threshold for the voice-activity gate.
              Segments below the threshold are treated as non-speech.
              Set to 0 to disable the gate.

              '
          file:
            type: string
            format: binary
            description: 'Audio file to transcribe. Maximum size: 500 MB.
              Supported container formats include WAV, MP3, OGG, Opus, FLAC,
              AAC, MP4, M4A, and MKV. Raw/headerless audio is also supported
              when `audio_format` and `sample_rate` are supplied.
              This field must be sent after all other multipart form fields.

              '
