# OpenAPI Overlay for XAIAPI
# This file allows you to make manual corrections to the OpenAPI specification
# without modifying the original file. The bootstrapper will apply this overlay
# on top of the cleaned openapi.yaml file.
#
# For overlay syntax, see: https://github.com/OAI/Overlay-Specification
#
# Update actions recursively merge objects and concatenate arrays. To replace
# an entire schema, remove the schema in one action and add it to
# $.components.schemas in the next action.

overlay: 1.0.0
info:
  title: XAIAPI API Overlay
  version: 1.0.0

# Example actions (uncomment and modify as needed):
# actions:
#   # Make a field required
#   - target: "$.components.schemas.User"
#     update:
#       required:
#         - user_id
#         - email
#
#   # Add a missing property
#   - target: "$.components.schemas.Product"
#     update:
#       properties:
#         newField:
#           type: string
#           description: "A field that was missing in the original spec"
#
#   # Fix an incorrect type
#   - target: "$.components.schemas.Order.properties.total"
#     update:
#       type: number
#       format: double
#
#   # Remove a deprecated field
#   - target: "$.components.schemas.LegacyModel.properties.oldField"
#     remove: true

# Live HTTP 400 captures include error-only objects; code is not always present.
actions:
  - target: "$.components.schemas.ErrorResponse.required"
    remove: true
  - target: "$.components.schemas.ErrorResponse"
    update:
      required:
        - error
  - target: "$.paths['/v1/stt'].post.responses['400']"
    update:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
